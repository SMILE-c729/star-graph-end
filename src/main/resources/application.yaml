# ==================== 服务器配置 ====================
server:
  port: 8080  # 应用监听端口

# ==================== Spring 应用配置 ====================
spring:
  application:
    name: star-graph-end  # 应用名称，用于服务注册、日志标识等
  profiles:
    active: dev  # 激活的配置文件（dev/test/prod），会加载 application-dev.yml

  # ==================== 数据源配置（MySQL） ====================
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver  # MySQL 8.x JDBC 驱动类
    url: jdbc:mysql://localhost:3306/stargraph?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true
    # JDBC URL 参数说明：
    # - useSSL=false: 禁用 SSL 连接（本地开发环境）
    # - serverTimezone=Asia/Shanghai: 设置时区为东八区
    # - characterEncoding=utf-8: 使用 UTF-8 编码
    # - allowPublicKeyRetrieval=true: 允许公钥检索（MySQL 8.0 新增认证方式）
    username: root     # 数据库用户名
    password: 123456   # 数据库密码（生产环境应使用环境变量或密钥管理器）

  # ==================== Redis 配置 ====================
  data:
    redis:
      host: localhost   # Redis 服务器地址
      port: 6379        # Redis 端口
      database: 1       # 使用第 2 个数据库（0-15，默认为 0）
      password: 123456  # Redis 密码（生产环境应使用环境变量）
      timeout: 5000ms   # 连接超时时间
      lettuce:
        pool:           # Lettuce 连接池配置（高性能异步 Redis 客户端）
          max-active: 8   # 最大活跃连接数
          max-idle: 8     # 最大空闲连接数
          min-idle: 0     # 最小空闲连接数

# ==================== MyBatis-Plus 配置 ====================
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml  # Mapper XML 文件位置
  global-config:
    db-config:
      id-type: auto              # 主键生成策略：auto=数据库自增
      logic-delete-field: deleted  # 逻辑删除字段名
      logic-delete-value: 1       # 已删除的值
      logic-not-delete-value: 0   # 未删除的值
  configuration:
    map-underscore-to-camel-case: true  # 开启下划线转驼峰命名（如 user_name → userName）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # SQL 日志输出到控制台（开发环境使用）

# ==================== ComfyUI 服务配置 ====================
comfyui:
  base-url: http://localhost:8000  # ComfyUI HTTP API 地址
  ws-url: ws://localhost:8000      # ComfyUI WebSocket 基础地址，程序会自动追加 /ws?clientId=...
  client-id: star-graph            # HTTP 提交任务和 WebSocket 连接共用的客户端标识

# ==================== 日志配置 ====================
logging:
  level:
    okhttp3: DEBUG  # 启用 OkHttp 详细日志，记录 HTTP 请求/响应（生产环境建议关闭）
